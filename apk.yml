name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Prepare app
        run: |
          f="$(ls *.html | head -1)"
          mkdir -p app/www
          cp "$f" app/www/index.html
          cd app
          echo '{"appId":"com.mylogical.simplecrm","appName":"Simple CRM","webDir":"www"}' > capacitor.config.json
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/app@7 @capacitor/cli@7
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleCRM-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
